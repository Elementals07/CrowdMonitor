name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Bundle
        working-directory: ./client
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrowdMonitor-app-debug.apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0
          name: CrowdMonitor Mobile APK
          draft: false
          prerelease: false
          body: |
            ### 📱 CrowdMonitor Android App (One-Click Download)
            
            Download and install **CrowdMonitor** on your Android phone!
            
            - **File**: `CrowdMonitor.apk`
            - **Direct Download**: Download the attached `.apk` file below directly on your mobile browser.
            - **Installation**: Tap to install (enable "Install from Unknown Sources" if prompted by Android).
          files: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
